# PostgreSQL 16 for the release benchmark, included from a fresh `initdb` data directory's
# postgresql.conf. The aim is PostgreSQL at its best for a single-client, in-memory working set that
# is never asked to survive a crash. REPORT-<version>.md gives the reason for each line.

# Unix socket only; the directory is short because sun_path holds 104 octets on macOS.
listen_addresses = ''
unix_socket_directories = '/Users/ed/.claude/tmp/tdbb'

# Closest to in-memory: no flush to disk, no waiting for the WAL at commit, no full-page images.
# PostgreSQL still writes WAL and data files through the OS page cache; it is not an in-memory engine.
fsync = off
synchronous_commit = off
full_page_writes = off
wal_level = minimal
max_wal_senders = 0
max_wal_size = 32GB
checkpoint_timeout = 1h

# The whole data set and its indexes fit in shared buffers (the largest scale is a few GB).
shared_buffers = 8GB
effective_cache_size = 48GB
work_mem = 512MB
maintenance_work_mem = 2GB
hash_mem_multiplier = 2.0

# Everything is in memory, so a random page costs what a sequential one does.
random_page_cost = 1.1
effective_io_concurrency = 0

# The harness sets max_parallel_workers_per_gather per run (0, and 4); these are the ceilings.
max_worker_processes = 16
max_parallel_workers = 16
max_parallel_workers_per_gather = 0

# JIT compilation costs more than it saves on queries of this size; it is switched off as a DBA
# tuning for short queries would. (This Homebrew build has no LLVM support, so it is moot here.)
jit = off

# The harness runs VACUUM ANALYZE after every load; autovacuum is left on as in production.
autovacuum = on
